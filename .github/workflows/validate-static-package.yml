name: Validate static package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate-static-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Validate static package
        run: node .github/validate-static-package.js
